name: Build-Fork-Image

# Publishes the panel image this fork's install script pulls.
#
# The upstream build.yml cannot do this job here. It pins
# IMAGE_NAME to `pasarguard/<repo>`, which is the upstream org on both Docker
# Hub and GHCR — a fork has write access to neither — and it logs in to Docker
# Hub with secrets a fork does not have. It also only fires on a release, while
# build-dev.yml explicitly skips main, so nothing ever built main at all.
#
# Kept as a separate file rather than patched into build.yml so that pulling
# upstream changes stays a clean merge.

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    meta:
        runs-on: ubuntu-latest
        outputs:
            image: ${{ steps.name.outputs.image }}
            sha: ${{ steps.name.outputs.sha }}
        steps:
            # GHCR rejects uppercase in a repository path and this owner has
            # capitals in it, so the name is lowercased rather than interpolated
            # straight from github.repository.
            - name: Compute image name
              id: name
              run: |
                  echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
                  echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

    build-dashboard:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              working-directory: ./dashboard
              run: bun install --frozen-lockfile

            # The Dockerfile expects dashboard/build to already exist; it is
            # gitignored, so it has to be produced here and carried into the
            # build context as an artifact.
            - name: Build dashboard
              run: ./build_dashboard.sh

            - name: Upload dashboard build
              uses: actions/upload-artifact@v7
              with:
                  name: dashboard-build
                  path: ./dashboard/build/
                  retention-days: 1

    build-images:
        needs: [meta, build-dashboard]
        strategy:
            matrix:
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      platform: linux/amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Download dashboard build
              uses: actions/download-artifact@v8
              with:
                  name: dashboard-build
                  path: ./dashboard/build/

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push ${{ matrix.arch }}
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  push: true
                  file: ./Dockerfile
                  tags: ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.sha }}-${{ matrix.arch }}
                  # Without these an image on the registry cannot be traced back
                  # to a commit, which makes "is this node on the new build yet?"
                  # unanswerable during a staged rollout.
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.created=${{ github.event.repository.updated_at }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    push-manifest:
        needs: [meta, build-images]
        runs-on: ubuntu-latest
        steps:
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # Three tags off one build: the commit for pinning and rollback,
            # `main` for anyone tracking the branch, and `latest` because that
            # is what the install script pulls by default.
            - name: Create manifests
              run: |
                  for tag in "${{ needs.meta.outputs.sha }}" main latest; do
                    docker buildx imagetools create \
                      -t "${{ needs.meta.outputs.image }}:${tag}" \
                      "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.sha }}-amd64" \
                      "${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.sha }}-arm64"
                  done
                  docker buildx imagetools inspect "${{ needs.meta.outputs.image }}:latest"
