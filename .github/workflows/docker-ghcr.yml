name: Build and push panel image (GHCR)

# Builds the dashboard, then the panel image, and pushes it to this fork's
# GitHub Container Registry so `docker compose up` can pull it — no Docker Hub
# secrets needed, only the built-in GITHUB_TOKEN.
#
# Deliberately plain (same rationale as the node repo): image name/tags are
# computed with shell instead of docker/metadata-action, and we build
# linux/amd64 only — panels run on x86 and the emulated arm64 leg only slows
# the pipeline down.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tags
        id: img
        run: |
          set -eux
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          tags="${image}:latest,${image}:${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${image}:${GITHUB_REF_NAME}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}"   >> "$GITHUB_OUTPUT"

      # The image serves the dashboard from dashboard/build/, which is built
      # here (not in the Dockerfile) — same split as upstream's release CI.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dashboard dependencies
        working-directory: ./dashboard
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: ./build_dashboard.sh

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Pushed ${{ steps.img.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
